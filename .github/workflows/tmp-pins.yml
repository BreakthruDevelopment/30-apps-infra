name: tmp pins (deleted before merge)
on:
  pull_request:
    paths: [".github/workflows/tmp-pins.yml"]
permissions:
  contents: read
jobs:
  pins:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set -eu
          cos="$(git ls-remote --tags --refs https://github.com/sigstore/cosign 'v2.*' | sed 's|.*refs/tags/||' | grep -E '^v2\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          echo "COSIGN $cos"
          for a in amd64 arm64; do
            curl -fsSL --proto =https "https://github.com/sigstore/cosign/releases/download/$cos/cosign-linux-$a" | sha256sum | sed "s|-|cosign-linux-$a|"
          done
          curl -fsSL --proto =https "https://github.com/sigstore/cosign/releases/download/$cos/cosign_checksums.txt" | grep -E 'cosign-linux-(amd64|arm64)$' || true
          for a in x86_64 arm64; do
            curl -fsSL --proto =https "https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_$a.tar.gz" | sha256sum | sed "s|-|crane-$a|"
          done
          for a in amd64 arm64; do
            curl -fsSL --proto =https "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_$a" | sha256sum | sed "s|-|yq-$a|"
          done
          for r in actions/checkout:v5 docker/setup-buildx-action:v3 docker/build-push-action:v6 docker/login-action:v3 actions/upload-artifact:v4 actions/download-artifact:v4 sigstore/cosign-installer:v3 hashicorp/setup-terraform:v3; do
            n=${r%%:*}; t=${r##*:}
            sha="$(git ls-remote https://github.com/$n "refs/tags/$t^{}" | cut -f1)"
            [ -n "$sha" ] || sha="$(git ls-remote https://github.com/$n "refs/tags/$t" | cut -f1)"
            echo "ACTION $n $t $sha"
          done
