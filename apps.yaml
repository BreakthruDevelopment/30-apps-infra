# Every deployed app. Each cloud's Terraform stack deploys the entries listing that cloud.
#
#   name    short, lowercase, hyphens allowed; becomes the service name and database name
#   title   optional display name (APP_NAME); defaults to name
#   clouds  any of: aws, azure, gcp, oci
#   image   GitHub Container Registry image published by the app repo's publish workflow
#   tag     an immutable sha-<commit> tag (never "latest", so deploys are repeatable)
#   domain  custom domain under breakthruventures.ai; DNS records are created in Cloudflare on deploy (AWS, Azure, Google Cloud, Oracle; see README). null = cloud default URL
#   ai      "demo" (recorded answers) or "gemini"
#   storage optional, true = a private upload bucket for the app (Google Cloud only; other clouds ignore it). See README "Object storage (Google Cloud)"
#   secrets optional list of secret env var NAMES (never values); see README "Per-app secrets"
apps:
  - name: template
    clouds: [aws, azure, gcp, oci]
    image: ghcr.io/breakthrudevelopment/30-apps-template
    tag: sha-99a8f86
    domain: null
    ai: gemini
  - name: build-tracker
    title: Portfolio Build Tracker
    clouds: [aws]
    image: ghcr.io/breakthrudevelopment/01-build-tracker
    tag: sha-a4e6649
    domain: app1.breakthruventures.ai
    ai: gemini
    secrets: [GITHUB_WEBHOOK_SECRET, INGEST_TOKEN, SYNC_TOKEN]
  - name: notes-kb
    title: Notes and Knowledge Base
    clouds: [azure]
    image: ghcr.io/breakthrudevelopment/02-notes-kb
    tag: sha-6675f0b
    domain: app2.breakthruventures.ai
    ai: gemini
  - name: expense-tracker
    title: Expense Tracker
    clouds: [gcp]
    image: ghcr.io/breakthrudevelopment/03-expense-tracker
    tag: sha-811aac4
    domain: app3.breakthruventures.ai
    ai: gemini
    storage: true
  - name: habit-tracker
    title: Habit and Goal Tracker
    clouds: [oci]
    image: ghcr.io/breakthrudevelopment/04-habit-tracker
    tag: sha-c91ffc1
    domain: app4.breakthruventures.ai
    ai: gemini
  - name: budget-planner
    title: Personal Budget Planner
    clouds: [aws]
    image: ghcr.io/breakthrudevelopment/05-budget-planner
    tag: sha-31081ae
    domain: app5.breakthruventures.ai
    ai: gemini
    secrets: [PLAID_CLIENT_ID, PLAID_SECRET, TOKEN_ENC_KEY]
  - name: read-later
    title: Bookmark and Read-Later
    clouds: [azure]
    image: ghcr.io/breakthrudevelopment/06-read-later
    tag: sha-51175dd
    domain: app6.breakthruventures.ai
    ai: gemini
